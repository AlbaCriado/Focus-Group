<style>
:root{--bg:#0D0D12;--c1:#16161E;--c2:#1F1F2A;--bd:#2C2C3A;--tx:#ECECF2;--mu:#9494A6;--y:#FFC93C;--p:#8B5CF6;--pl:#B79BFF;--r:0px;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif;line-height:1.55;letter-spacing:-.005em}
h1,h2,h3,.hf{margin:0;line-height:1.1;letter-spacing:-.02em;font-family:"Bricolage Grotesque","Segoe UI","Helvetica Neue",Arial,sans-serif;font-weight:800}h2{font-size:1.5rem}h3{font-size:1.05rem}p{margin:.3em 0 .8em}.mu{color:var(--mu);font-size:.93rem}.sp{flex:1}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:20;background:rgba(13,13,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
#logo{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;border-radius:0;padding:0;color:var(--tx)}#logo:hover{filter:none}#logo svg{width:58px;height:56px}
main{max-width:1040px;margin:auto;padding:24px 16px 90px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);border-radius:var(--r);padding:12px 20px;font-weight:700;background:var(--c2);color:var(--tx);display:inline-flex;align-items:center;gap:8px;transition:.15s}
button:hover{border-color:var(--pl)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--y);outline-offset:2px}button:disabled{opacity:.35;cursor:default}
.pri{background:var(--y);color:#17130A;border-color:var(--y)}.pur{background:var(--p);border-color:var(--p);color:#fff}.sm{padding:8px 14px;font-size:.88rem}.dg:hover{border-color:#E5534B;color:#FF8680}
.nv{border:0;background:none;padding:8px 16px;font-size:1rem}.nv:hover{color:var(--pl)}.nv.on{color:var(--y);box-shadow:inset 0 -3px 0 var(--y)}.vr{width:1px;height:26px;background:#fff}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;place-items:center;padding:16px}#modal.on{display:grid}.mb{background:var(--c1);border:1px solid var(--p);padding:26px;max-width:440px;width:100%}.red{background:#C93A34;border-color:#C93A34;color:#fff}
.hero{min-height:68vh;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative}
.hero h1{font-size:clamp(3.2rem,13vw,8rem);letter-spacing:-.045em;line-height:.92}
.hero p{font-size:clamp(1.1rem,3vw,1.5rem);color:var(--mu);max-width:560px}
.hero .bar2{width:96px;height:8px;background:linear-gradient(90deg,var(--y) 70%,var(--p) 70%)}
.big{display:flex;gap:14px;flex-wrap:wrap}.big button{padding:22px 34px;font-size:1.15rem;flex:1;min-width:230px;justify-content:center}
.dz{position:absolute;right:-30px;top:6%;width:min(380px,55vw);opacity:.14;pointer-events:none}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.grid .card{margin:0}
.fgc{cursor:pointer}.fgc.open{border-color:var(--p);grid-column:1/-1}.fgc:hover{border-color:var(--pl)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:0;background:var(--c2);color:var(--mu)}.badge.ok{background:rgba(255,201,60,.14);color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}.chip{padding:8px 14px;font-size:.9rem;background:var(--c1)}.chip.on{background:var(--y);color:#17130A;border-color:var(--y)}
input[type=text],textarea{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx)}
textarea{min-height:120px;resize:vertical}
.txt{white-space:pre-wrap;padding:12px 0;min-height:30px}.empty{color:var(--mu);font-style:italic}
.blk{padding:14px 0;border-top:1px solid var(--bd)}.blk:first-of-type{border-top:0}
.tip{border-left:3px solid var(--p);background:rgba(139,92,246,.1);padding:10px 14px;margin:8px 0;font-size:.92rem;border-radius:0 var(--r) var(--r) 0}
.sec{scroll-margin-top:calc(var(--hh,71px) + 100px)}.sec>.card>.row:first-child{margin-bottom:10px}.sh{width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;background:rgba(139,92,246,.18);color:var(--pl)}
#prog{position:sticky;top:var(--hh,71px);z-index:15;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd);margin-bottom:20px}
.track{height:6px;background:var(--c2);border-radius:0;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,var(--p),var(--y));transition:width .4s}
.st{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.st::-webkit-scrollbar{display:none}.st button{padding:5px 10px;font-size:.78rem;white-space:nowrap;gap:5px}.st svg.i{width:14px;height:14px}.st button.dn{border-color:var(--y);color:var(--y)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.map{width:100%;background:#0A0A10;border:1px solid var(--bd);border-radius:var(--r);margin:10px 0}
.c{stroke:#0A0A10;stroke-width:.7;transition:.15s}.t0{fill:#2D2A47}.t1{fill:#3A3358}.t2{fill:#262338}.t3{fill:#41375F}.c.on{fill:var(--y)}

 const top=Object.entries(f).sort((a,b)=>b[1]-a[1]),Pp=ss.filter(s=>pos.test(s)&&!neg.test(s)),N=ss.filter(s=>neg.test(s));
 const L=a=>a.length?a.slice(0,6).map(x=>'• '+x).join('\n'):'• No se han detectado.';
 S.d.summary=`TEMAS PRINCIPALES\n${top.slice(0,5).map(x=>'• '+x[0]).join('\n')||'• —'}\n\nOPINIONES POSITIVAS\n${L(Pp)}\n\nOPINIONES NEGATIVAS\n${L(N)}\n\nIDEAS RECURRENTES\n${top.filter(x=>x[1]>1).slice(0,5).map(x=>`• "${x[0]}" (${x[1]} menciones)`).join('\n')||'• Ninguna palabra se repite lo suficiente.'}\n\nRECOMENDACIONES PRÁCTICAS\n${N.slice(0,4).map(x=>'• Revisar: '+x).join('\n')||'• Sin puntos críticos detectados.'}`;
 commit();render();toast('Resumen generado');
}
const scriptTxt=d=>`INTRODUCCIÓN\n${d.intro||'—'}\n\n${d.qs.map((q,i)=>`PREGUNTA ${i+1}\n${q||'—'}`).join('\n\n')}\n\nACTIVIDAD GRUPAL\n${d.act||'(Sin actividad)'}\n\nCIERRE\n${d.close||'—'}`;
const resTxt=d=>RES.map(r=>`${r[2].toUpperCase()}\n${d.res[r[0]]||'—'}`).join('\n\n');
function pdf(id){const d=id?DB.find(x=>x.id==id):S.d,p=d.p,sec=(h,t)=>`<h2>${h}</h2><pre>${esc(t)||'—'}</pre>`;
 $('#print').innerHTML=`<h1>${esc(d.title||'Focus group sin título')}</h1><p>MissFocus · ${d.done?'Completado':'En curso'} · ${new Date().toLocaleDateString('es-ES')}</p>${sec('Objetivo',d.obj)}<h2>Participantes</h2>${Object.keys(LBL).map(k=>`<p><b>${LBL[k]}:</b> ${esc(p[k].join(', ')||'—')}</p>`).join('')}<p><b>Países:</b> ${esc(p.c.join(', ')||'—')}</p>${sec('Guión',scriptTxt(d))}${sec('Resumen de respuestas',d.summary)}${sec('Resultados',resTxt(d))}${sec('Solución del equipo',d.res.team)}`;
 setTimeout(()=>print(),150)}
// vistas
const fmt=s=>new Date(s).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});
function vHome(){return `<section class="hero"><svg class="dz" viewBox="-20 -20 40 40">${petals(ALL,'#8B5CF6')}<circle r="6" fill="#FFC93C"/></svg><div class="bar2"></div><h1>MissFocus</h1><p>Crea y organiza tus focus group.</p><div class="big"><button class="pri" onclick="go('col')">${ic('script')} Mi colección</button><button class="pur" onclick="newFG()">${ic('plus')} Crear focus group</button></div></section>`}
function vCol(){const l=DB.filter(x=>S.filter=='all'||(S.filter=='done')==x.done);
 const ch=(k,t)=>`<button class="chip ${S.filter==k?'on':''}" onclick="S.filter='${k}';render()">${t}</button>`;
 return `<h2 style="font-size:2rem">Mi colección</h2><p class="mu">Selecciona un focus group para ver su objetivo y acceder a cada sección.</p><div class="chips">${ch('all','Todos ('+DB.length+')')}${ch('prog','En curso ('+DB.filter(x=>!x.done).length+')')}${ch('done','Completados ('+DB.filter(x=>x.done).length+')')}</div>
 ${l.length?`<div class="grid">${l.map(x=>{const o=S.open==x.id;return `<div class="card fgc ${o?'open':''}" onclick="S.open=${o?'null':x.id};render()"><div class="row">${daisy(x.done)}<div><h3>${esc(x.title||'Sin título')}</h3><span class="badge ${x.done?'ok':''}">${x.done?'Completado':'En curso'}</span></div></div><p class="mu">Editado el ${fmt(x.upd)}</p>${o?`<div onclick="event.stopPropagation()"><div class="tip"><b>Objetivo</b><br>${esc(x.obj||'Todavía sin objetivo.')}</div><div class="tools"><button class="sm pur" onclick="viewFG(${x.id})">${ic('script')} Ver todo el contenido</button>${SECS.map(s=>`<button class="sm" onclick="openFG(${x.id},'${s[0]}')">${ic(s[2])} ${s[1]}</button>`).join('')}<button class="sm pri" onclick="pdf(${x.id})">${ic('dl')} Informe PDF</button><button class="sm dg" onclick="delFG(${x.id})">${ic('trash')} Eliminar</button></div></div>`:''}</div>`}).join('')}</div>`
 :`<div class="card"><h3>Aquí no hay nada todavía</h3><p class="mu">Crea tu primer focus group para empezar.</p><button class="pri" onclick="newFG()">Crear focus group</button></div>`}`}
function blk(k,lbl,ph,hint,rows,ico){const e=S.ed[k],v=getV(S.d,k);
 return `<div class="blk"><div class="row"><h3>${lbl}</h3><span class="sp"></span><button class="sm" onclick="cp('${k}')">${ic('copy')} Copiar</button><button class="sm ${e?'pur':''}" onclick="tedit('${k}')">${ic(e?'check':'edit')} ${e?'Listo':'Editar'}</button></div>${hint?`<div class="tip">${hint}</div>`:''}${e?`<textarea data-k="${k}" placeholder="${ph}" oninput="set(this)" style="min-height:${rows||110}px">${esc(v)}</textarea>`:`<div class="txt ${v?'':'empty'}">${esc(v)||'Sin completar'}</div>`}</div>`}
const sec=(id,t,ico,inner)=>`<div class="sec" id="s-${id}"><div class="card"><div class="row"><div class="sh">${ic(ico)}</div><h2>${t}</h2></div>${inner}</div></div>`;
const sorted=()=>MAP.map(x=>x[0]).sort((a,b)=>a.localeCompare(b,'es'));
const selTxt=()=>{const c=S.d.p.c;return c.length==MAP.length?'Público internacional (todos los países)':c.length?c.slice().sort((a,b)=>a.localeCompare(b,'es')).join(', '):'Ningún país seleccionado'};
function opts(q){q=(q||'').toLowerCase();const c=S.d.p.c,l=sorted().filter(n=>n.toLowerCase().includes(q));return l.length?l.map(n=>`<button class="opt ${c.includes(n)?'on':''}" onclick="pick('${n}')"><span>${n}</span>${c.includes(n)?ic('check'):''}</button>`).join(''):'<div class="mu" style="padding:12px">Sin resultados</div>'}
function csIn(el){$('#clist').innerHTML=opts(el.value);$('#clist').style.display='block'}
function pick(n){const a=S.d.p.c,i=a.indexOf(n);i<0?a.push(n):a.splice(i,1);commit();refMap()}
function refMap(){const c=S.d.p.c;document.querySelectorAll('.c').forEach(e=>e.classList.toggle('on',c.includes(e.dataset.n)));const l=$('#clist');if(l)l.innerHTML=opts($('#csearch').value);const t=$('#csel');if(t)t.textContent=selTxt()}
document.addEventListener('click',e=>{const l=$('#clist');if(l&&!e.composedPath().some(n=>n.id=='cs'))l.style.display='none'});
function vMap(e){const t=['t0','t1','t2','t3'],c=S.d.p.c;
 return `<div class="blk"><div class="row"><h3>Países del público</h3><span class="sp"></span>${e?`<button class="sm pur" onclick="allC()">${ic('globe')} Público internacional</button>`:''}</div>${e?`<p class="mu">Toca un país del mapa o búscalo por nombre. Vuelve a tocarlo para quitarlo.</p><div id="cs"><input type="text" id="csearch" placeholder="Buscar país…" autocomplete="off" aria-label="Buscar país" onfocus="csIn(this)" onclick="csIn(this)" oninput="csIn(this)" onkeydown="if(event.key=='Escape')$('#clist').style.display='none'"><div id="clist"></div></div>`:''}<svg class="map ${e?'ed':''}" viewBox="0 0 360 152" role="group" aria-label="Mapamundi político">${MAP.map((x,i)=>`<polygon class="c ${t[i%4]} ${c.includes(x[0])?'on':''}" data-n="${x[0]}" points="${x[1]}" ${e?`onclick="pick('${x[0]}')"`:''}><title>${x[0]}</title></polygon>`).join('')}</svg><p class="mu" id="csel">${esc(selTxt())}</p></div>`}
function vPart(){const e=S.ed.part,p=S.d.p;
 return `<div class="row"><span class="sp"></span><button class="sm ${e?'pur':''}" onclick="tedit('part')">${ic(e?'check':'edit')} ${e?'Listo':'Editar participantes'}</button></div>${Object.keys(LBL).map(k=>`<div class="blk"><h3>${LBL[k]}</h3>${e?`<div class="chips">${OPT[k].map(o=>`<button class="chip ${p[k].includes(o)?'on':''}" aria-pressed="${p[k].includes(o)}" onclick="tog('${k}','${o}')">${o}</button>`).join('')}</div>`:`<p class="${p[k].length?'':'empty mu'}" style="margin:6px 0 0">${esc(p[k].join(', '))||'Sin completar'}</p>`}</div>`).join('')}${vMap(e)}`}
function prog(){const d=S.d,r=d.res,done=[d.obj.trim(),Object.values(d.p).some(a=>a.length),d.intro||d.qs.some(q=>q)||d.act||d.close,d.notes||d.summary,RES.some(k=>r[k[0]]),r.team];
 const n=done.filter(Boolean).length;$('#prog').innerHTML=`<div class="st">${SECS.map((s,i)=>`<button class="${done[i]?'dn':''}" onclick="jump('${s[0]}')">${ic(done[i]?'check':s[2])} ${s[1]}</button>`).join('')}</div><div class="track"><div class="fill" style="width:${Math.round(n/6*100)}%"></div></div><div class="mu" style="margin-top:4px">${n} de 6 pasos completados</div>`}
function viewFG(id){S.vid=id;S.view='full';render(1)}
function vFull(){const d=DB.find(x=>x.id==S.vid);if(!d)return vCol();const p=d.p,T=v=>`<div class="txt ${v?'':'empty'}">${esc(v)||'Sin completar'}</div>`,C=(t,b)=>`<div class="card"><h2 style="margin-bottom:8px">${t}</h2>${b}</div>`,H=t=>`<h3 style="margin:16px 0 2px">${t}</h3>`;
 return `<div class="row"><button class="sm" onclick="go('col')">Volver a la colección</button><span class="sp"></span><button class="sm" onclick="openFG(${d.id})">${ic('edit')} Editar</button><button class="sm pri" onclick="pdf(${d.id})">${ic('dl')} Informe PDF</button></div><div class="row" style="margin:20px 0">${daisy(d.done,48)}<h1 style="font-size:2rem">${esc(d.title||'Focus group sin título')}</h1></div>`
 +C('Objetivo',T(d.obj))+C('Participantes',Object.keys(LBL).map(k=>`<p style="margin:0 0 6px"><b>${LBL[k]}:</b> ${esc(p[k].join(', ')||'—')}</p>`).join('')+`<p><b>Países:</b> ${esc(p.c.length==MAP.length?'Público internacional':p.c.join(', ')||'—')}</p>`)+C('Guión',T(scriptTxt(d)))+C('Respuestas y feedback',H('Notas')+T(d.notes)+H('Resumen')+T(d.summary))+C('Resultados',RES.map(r=>H(r[2])+T(d.res[r[0]])).join(''))+C('Solución del equipo',T(d.res.team))}
function vWiz(){const d=S.d,e=S.ed;
 return `<div id="prog"></div><div class="row"><div style="flex:1;min-width:200px">${e.title?`<input type="text" data-k="title" value="${esc(d.title)}" placeholder="Nombre del focus group" aria-label="Nombre" oninput="set(this)" onchange="commit()" style="font-size:1.3rem;font-weight:800">`:`<h1 style="font-size:2rem">${esc(d.title||'Focus group sin título')}</h1>`}</div><button class="sm" onclick="tedit('title')">${ic(e.title?'check':'edit')} ${e.title?'Listo':'Editar nombre'}</button></div>
 <div class="tools"><button class="pri" onclick="save()">${ic('save')} Guardar</button><button id="undo" onclick="undo()" ${S.h.length?'':'disabled'}>${ic('undo')} Deshacer</button><button onclick="pdf()">${ic('dl')} Descargar informe PDF</button></div><div style="height:12px"></div>
 ${sec('obj','Objetivo principal','target',blk('obj','Objetivo','Escribe aquí el objetivo…','Piensa en el problema que tienes y en cómo quieres resolverlo. Un buen objetivo es concreto y se puede responder con lo que digan los participantes. Ejemplo: descubrir por qué los usuarios no terminan el registro.',130))}
 ${sec('part','Participantes','users',vPart())}
 ${sec('gui','Guión','script',blk('intro','Introducción','Bienvenidos y gracias por venir…','Empieza con una frase dinámica que rompa el hielo y no olvides explicar las reglas: no hay respuestas correctas, todas las opiniones valen y se respeta el turno.')+d.qs.map((q,i)=>blk('qs.'+i,'Pregunta '+(i+1),'Escribe tu pregunta…',i==0?'Haz preguntas abiertas que generen conversación y debate: empieza por «¿Cómo…?», «¿Qué…?» o «¿Por qué…?» y evita las que se responden con sí o no.':'',80)+(i>2?`<button class="sm dg" onclick="delQ(${i})">${ic('trash')} Quitar pregunta</button>`:'')).join('')+`<div class="tools"><button class="sm" onclick="addQ()">${ic('plus')} Añadir pregunta</button></div>`+blk('act','Actividad grupal (opcional)','Puedes dejarla en blanco…','',90)+blk('close','Cierre','Muchas gracias por…','Agradece a los participantes su tiempo y esfuerzo, y cuéntales qué harás con lo que han compartido.',90)+`<div class="tools"><button onclick="copy(scriptTxt(S.d))">${ic('copy')} Copiar todo el guión</button><button onclick="dl('guion.txt',scriptTxt(S.d))">${ic('dl')} Exportar .txt</button></div>`)}
 ${sec('resp','Respuestas y feedback','chat',blk('notes','Notas del focus group','Pega aquí las notas o la transcripción…','',220)+`<div class="tools"><button class="pur" onclick="analyse()">Generar resumen</button></div><p class="mu">El resumen se calcula en tu navegador detectando palabras clave, sin enviar nada a internet. Úsalo como punto de partida y edítalo.</p>`+(d.summary?blk('summary','Resumen','','',320):''))}
 ${sec('res','Resultados','chart',RES.map(r=>blk('res.'+r[0],r[2],'Escribe aquí…','',100)).join('')+`<div class="tools"><button onclick="copy(resTxt(S.d))">${ic('copy')} Copiar todo</button><button onclick="dl('resultados.txt',resTxt(S.d))">${ic('dl')} Exportar .txt</button></div>`)}
 ${sec('team','Solución del equipo','flag',blk('res.team','Solución del equipo','¿Qué solución propone vuestro equipo?','Resume la decisión final: qué vais a cambiar, quién se encarga y para cuándo.',140)+`<div class="tools"><button class="pri" onclick="S.d.done=!S.d.done;save()">${ic('check')} ${d.done?'Marcar como en curso':'Marcar como completado'}</button></div>`)}
 <div class="tools" style="margin-top:8px"><button class="pri" onclick="save()">${ic('save')} Guardar</button></div>`}
function render(top){const y=scrollY;
 $('#app').innerHTML=S.view=='home'?vHome():S.view=='col'?vCol():S.view=='full'?vFull():vWiz();
 $('#n-col').classList.toggle('on',S.view=='col'||S.view=='full');$('#n-new').classList.toggle('on',S.view=='wiz');
 if(S.view=='wiz')prog();document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px');scrollTo(0,top?0:y)}
addEventListener('resize',()=>document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px'));
render();
</script>
</body>
</html>
